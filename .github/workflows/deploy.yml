# 定时构建 GFS 数据 → 前端打包 → 部署 GitHub Pages（upload-pages-artifact，不进 git 历史）
#
# 触发：
#   - schedule: 4 次/天，cycle 落地后（00/06/12/18 UTC 的 GFS 约滞后 3.5-5h）
#   - workflow_dispatch: 手动触发，可用 --fxx 0 快速验证部署链路
#
# Pages 一次性设置：仓库 Settings → Pages → Source = "GitHub Actions"
# 失败（如 cycle 未落地、数据源不可达）→ 本次跳过部署，线上保持上次好版本。

name: 部署 Pages

on:
  schedule:
    - cron: '30 5,11,17,23 * * *'
  workflow_dispatch:
    inputs:
      fxx:
        description: '预报时次（默认 0:120:3 全量 41 个；快速验证用 0）'
        required: false
        default: '0:120:3'
      source:
        description: '数据源 nomads / aws / google（大陆网络 aws/google 常被墙）'
        required: false
        default: 'nomads'

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免数据互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/pyproject.toml

      - name: 安装 Python 依赖
        working-directory: pipeline
        run: pip install -e .

      - name: 下载并编码 GFS 数据
        run: |
          python -m pipeline.run --latest \
            --fxx "${{ inputs.fxx }}" \
            --source "${{ inputs.source }}" \
            --out web/public/data

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 前端依赖 + 构建
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: 部署到 Pages
        uses: actions/deploy-pages@v4
