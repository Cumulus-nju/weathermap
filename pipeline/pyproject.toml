[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "weathermap-pipeline"
version = "0.1.0"
description = "GFS 0.25° East-Asia crop pipeline for weathermap web"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "xarray",
    "cfgrib",
    "requests",
]

[project.scripts]
wm-pipeline = "pipeline.run_pipeline:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]
